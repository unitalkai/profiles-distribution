name: alma
version: 1.0.0
description: "Unitalk AI collaborator — autonomous prospection, calls, emails, and admin work"
hermes_requires: ">=0.12.0"
author: "Unitalk AI"
license: "MIT"

# Environment variables the agent needs. Checked against the installer's
# shell environment and existing .env so they aren't nagged about keys
# they already have configured.
env_requires:
  - name: OPENAI_API_KEY
    description: "OpenAI API key (for model access)"
    required: true
  - name: UNITALK_API_KEY
    description: "Unitalk AI API key — contact hello@unitalk.ai to obtain one"
    required: true
  - name: GOOGLE_CLIENT_ID
    description: "Google OAuth client ID (for Gmail/Calendar integration)"
    required: false
    default: ""
  - name: GOOGLE_CLIENT_SECRET
    description: "Google OAuth client secret (for Gmail/Calendar integration)"
    required: false
    default: ""