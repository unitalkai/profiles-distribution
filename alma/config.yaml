# Alma Profile Configuration

display:
  interface: tui
  theme: dark

model:
  provider: openai
  name: gpt-4-turbo
  temperature: 0.7
  max_tokens: 4096

tools:
  enabled:
    - terminal
    - web_search
    - web_extract
    - browser_exec
    - delegate_task
    - read_file
    - write_file
    - patch
    - search_files
    - execute_code
  disabled: []

memory:
  backend: sqlite
  max_entries: 1000

session:
  auto_save: true
  compression: enabled
