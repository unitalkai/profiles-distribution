name: alma
version: 1.0.0
description: Unitalk AI collaborator — autonomous prospection, calls, emails, admin tasks
author: Unitalk AI
license: MIT

# Required environment variables
env:
  - UNITALK_API_KEY
  - OPENAI_API_KEY

# Skills to install with this profile
skills:
  - name: unitalk-core
    source: builtin
  - name: email-inbox-triage
    source: hermes-skills
  - name: google-workspace
    source: hermes-skills

# MCP servers to connect
mcp:
  - name: unitalk-tools
    command: npx
    args: ["-y", "@unitalkai/mcp-server"]

# Cron jobs
cron:
  - name: daily-prospection
    schedule: "0 9 * * 1-5"
    task: "Run daily prospection routine for assigned leads"
  - name: email-triage
    schedule: "0 */4 * * *"
    task: "Triage inbox and prioritize urgent threads"

# Config overrides
config:
  display:
    interface: tui
  model:
    provider: openai
    name: gpt-4-turbo
  tools:
    enabled:
      - terminal
      - web_search
      - browser_exec
      - delegate_task
